
name: Terraform GCP Deployment


on:
  push:
    branches:
      - main


permissions:
  contents: read
  id-token: write


jobs:

 terraform:

  runs-on: ubuntu-latest


  steps:

  - name: Checkout Repository
    uses: actions/checkout@v4


  - name: Authenticate to Google Cloud
    uses: google-github-actions/auth@v2
    with:

      workload_identity_provider: projects/1022193013171/locations/global/workloadIdentityPools/github-pool/providers/github-provider

      service_account: github-terraform@project-5dc5e3a3-e2f5-492c-b5a.iam.gserviceaccount.com


  - name: Setup gcloud
    uses: google-github-actions/setup-gcloud@v2


  - name: Verify Authentication
    run: |
      gcloud auth list
      gcloud config list